{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Edit Resource
                    </h2>

                    <form method="POST">

                        <div class="mb-3">
                            <label>Title</label>
                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   value="{{ resource[1] }}"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Description</label>
                            <textarea name="description"
                                      class="form-control"
                                      rows="4"
                                      required>{{ resource[2] }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label>Resource Notes</label>
                            <textarea name="notes"
                                    class="form-control"
                                    rows="8"
                                    required>{{ resource[4] }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label>Resource Link</label>
                            <input type="url"
                                   name="link"
                                   class="form-control"
                                   value="{{ resource[3] }}"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-success">
                            Update Resource
                        </button>

                        <a href="/manage_resources"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
