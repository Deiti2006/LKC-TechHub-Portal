{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">Member Registration</h2>

                <form action="/register" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" placeholder="Enter your full name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">University Roll Number</label>
                        <input type="text" name="roll_number" class="form-control" placeholder="Enter your roll number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control" value="Computer Science" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Semester</label>
                        <select name="semester" class="form-select">
                            <option>Select Semester</option>
                            <option>Semester I</option>
                            <option>Semester III</option>
                            <option>Semester V</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="Enter your phone number">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Create Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a password">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm your password">
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register</button>
                        </a>
                    </div>

                    <p class="text-center mt-3">
                        Already a member?
                        <a href="/login">Login Here</a>
                    </p>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
